[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory-operations-agent"
version = "0.1.0"
description = "AI-assisted factory operations and knowledge retrieval platform"
requires-python = ">=3.11,<3.12"
dependencies = [
"fastapi",
"uvicorn[standard]",
"numpy",
"sentence-transformers",
]

[project.optional-dependencies]
dev = [
"pytest",
"httpx",
"ruff",
]

[tool.setuptools.packages.find]
include = ["backend*"]
exclude = [
"backend.tests*",
"data*",
"evaluations*",
"infrastructure*",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
"E",
"F",
"I",
"UP",
"B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"